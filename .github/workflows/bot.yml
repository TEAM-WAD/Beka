name: PHP Bot Runner

on:
  schedule:
    - cron: '*/5 * * * *' # يعمل تلقائياً كل 5 دقائق (يمكنك تعديل الرقم حسب الحاجة)
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً متى شئت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, mysqli, pdo_mysql, sockets

      - name: Execute PHP Bot
        run: php bot.php
        
