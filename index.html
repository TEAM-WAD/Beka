<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة النتائج الامتحانية الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- مكتبات فك الضغط (ZIP + RAR) داخل المتصفح -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/unrar-js@0.2.2/lib/unrar.min.js"></script>
    <!-- مكتبة قراءة PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background: #080c14; color: #f1f5f9; min-height: 100vh; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 500px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.08) 50%, transparent 70%); z-index: 0; filter: blur(80px); pointer-events: none; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col justify-between relative selection:bg-blue-500 selection:text-white">

    <div class="bg-glow"></div>

    <header class="relative z-10 w-full py-5 px-4 border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-600/20 border border-blue-500/30 rounded-2xl text-blue-400">
                    <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-300">
                        منظومة النتائج الامتحانية
                    </h1>
                    <p class="text-xs text-slate-400">استعلام ومعالجة فورية داخل المتصفح</p>
                </div>
            </div>

            <button onclick="toggleAdminModal(true)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-blue-400"></i>
                لوحة الأدمن
            </button>
        </div>
    </header>

    <main class="relative z-10 flex-grow flex flex-col items-center justify-center p-4 my-8">
        <div class="w-full max-w-2xl">
            <div class="glass-card rounded-3xl p-6 sm:p-10 mb-8">
                <div class="text-center mb-8">
                    <span id="dbStatusBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-3">
                        ⚠️ بانتظار رفع القوائم من الأدمن
                    </span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">أدخل رقمك الامتحاني</h2>
                    <p class="text-slate-400 text-sm">سيتم عرض صورة القائمة الرسمية المشتملة على درجتك فوراً</p>
                </div>

                <form id="searchForm" class="space-y-4">
                    <div class="relative rounded-2xl bg-slate-900/90 border border-slate-700/80 p-2 flex items-center gap-2">
                        <div class="p-3 text-slate-400">
                            <i data-lucide="search" class="w-6 h-6"></i>
                        </div>
                        <input type="text" id="rollNumber" required placeholder="مثال: 25241005001" 
                            class="w-full bg-transparent text-white text-lg font-bold placeholder-slate-500 focus:outline-none tracking-widest text-right px-2">
                        <button type="submit" id="searchBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold px-6 py-3.5 rounded-xl transition flex items-center gap-2 shrink-0">
                            <span>بحث</span>
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                    </div>
                </form>

                <div id="alertBox" class="hidden mt-4 p-4 rounded-xl text-sm font-semibold flex items-center gap-3"></div>
            </div>

            <div id="resultContainer" class="hidden space-y-4">
                <div class="glass-card rounded-3xl p-5 border border-slate-700/50">
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-4 pb-4 border-b border-slate-800">
                        <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                            تم العثور على القائمة الرسمية!
                        </h3>
                        <a id="downloadBtn" download="result_page.png" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            تحميل القائمة
                        </a>
                    </div>
                    <div class="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 flex justify-center">
                        <img id="resultImage" src="" alt="قائمة النتيجة" class="w-full h-auto object-contain max-h-[800px]">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="adminModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-lg w-full border border-slate-700">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="file-archive" class="w-5 h-5 text-blue-400"></i>
                    رفع وتفكيك الملف المضغوط
                </h3>
                <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2">اختر الملف المضغوط (ZIP أو RAR)</label>
                    <input type="file" id="archiveFile" accept=".zip,.rar" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-bold hover:file:bg-blue-500 cursor-pointer">
                </div>

                <div id="processBox" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-slate-300 font-bold">
                        <span id="processStatus">جاري المعالجة...</span>
                        <span id="processPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
                        <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>

                <div id="adminAlert" class="hidden p-3 rounded-xl text-xs font-bold"></div>

                <button onclick="startProcessing()" id="startBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                    <span>بدء التفكيك والفهرسة</span>
                </button>

                <button onclick="clearDatabase()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-2.5 rounded-xl border border-red-500/20 text-xs transition">
                    مسح جميع النتائج المخزنة سابقاً
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DB_NAME = "ResultsSystemDB";
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains("results")) {
                        db.createObjectStore("results", { keyPath: "roll" });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; updateStatusBadge(); resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }
        initDB();

        function toggleAdminModal(show) {
            document.getElementById('adminModal').classList.toggle('hidden', !show);
        }

        async function updateStatusBadge() {
            const tx = db.transaction("results", "readonly");
            const store = tx.objectStore("results");
            const countRequest = store.count();
            countRequest.onsuccess = () => {
                const count = countRequest.result;
                const badge = document.getElementById('dbStatusBadge');
                if (count > 0) {
                    badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-3";
                    badge.innerHTML = `✅ النظام جاهز - يحتوي على (${count}) رقم امتحاني مفهرس`;
                }
            };
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roll = document.getElementById('rollNumber').value.trim();
            const btn = document.getElementById('searchBtn');
            const alertBox = document.getElementById('alertBox');
            const resultContainer = document.getElementById('resultContainer');

            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div>`;
            alertBox.classList.add('hidden');
            resultContainer.classList.add('hidden');

            const tx = db.transaction("results", "readonly");
            const store = tx.objectStore("results");
            const request = store.get(roll);

            request.onsuccess = () => {
                if (request.result) {
                    document.getElementById('resultImage').src = request.result.imageData;
                    document.getElementById('downloadBtn').href = request.result.imageData;
                    resultContainer.classList.remove('hidden');
                } else {
                    alertBox.className = "p-4 rounded-xl text-sm font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
                    alertBox.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 inline"></i> لم يتم العثور على الرقم الامتحاني (${roll}).`;
                    alertBox.classList.remove('hidden');
                }
                btn.disabled = false;
                btn.innerHTML = `<span>بحث</span><i data-lucide="arrow-left" class="w-5 h-5"></i>`;
                lucide.createIcons();
            };
        });

        // دالة استخراج ملفات PDF من ZIP أو RAR
        async function extractPdfBuffers(file, updateStatus) {
            const fileName = file.name.toLowerCase();
            const pdfFiles = [];

            if (fileName.endsWith('.zip')) {
                updateStatus("جاري قراءة ملف ZIP...");
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);
                for (const [relativePath, zipEntry] of Object.entries(zipContent.files)) {
                    if (!zipEntry.dir && relativePath.toLowerCase().endsWith('.pdf')) {
                        const buffer = await zipEntry.async("arraybuffer");
                        pdfFiles.push({ name: relativePath, buffer: buffer });
                    }
                }
            } else if (fileName.endsWith('.rar')) {
                updateStatus("جاري قراءة ملف RAR...");
                const arrayBuffer = await file.arraybuffer();
                const extractor = readRARContent(arrayBuffer);
                for (const item of extractor) {
                    if (item.filename.toLowerCase().endsWith('.pdf')) {
                        pdfFiles.push({ name: item.filename, buffer: item.fileData.buffer });
                    }
                }
            }
            return pdfFiles;
        }

        function readRARContent(arrayBuffer) {
            try {
                const extractor = readArchive({ buffer: arrayBuffer });
                return extractor.files || [];
            } catch (e) {
                throw new Error("تعذر قراءة ملف RAR. يُفضل تحويله إلى ZIP للسرعة.");
            }
        }

        async function startProcessing() {
            const fileInput = document.getElementById('archiveFile');
            const startBtn = document.getElementById('startBtn');
            const processBox = document.getElementById('processBox');
            const progressBar = document.getElementById('progressBar');
            const processPercent = document.getElementById('processPercent');
            const processStatus = document.getElementById('processStatus');
            const adminAlert = document.getElementById('adminAlert');

            if (!fileInput.files.length) {
                alert("يرجى اختيار ملف أولاً!");
                return;
            }

            const file = fileInput.files[0];
            startBtn.disabled = true;
            processBox.classList.remove('hidden');
            adminAlert.classList.add('hidden');

            try {
                const pdfFiles = await extractPdfBuffers(file, (msg) => processStatus.innerText = msg);

                if (pdfFiles.length === 0) {
                    throw new Error("لم يتم العثور على ملفات PDF داخل الملف المرفوع.");
                }

                let indexedCount = 0;
                const totalFiles = pdfFiles.length;

                for (let i = 0; i < totalFiles; i++) {
                    const pdfItem = pdfFiles[i];
                    processStatus.innerText = `تحليل الملف (${i + 1} من ${totalFiles}): ${pdfItem.name}`;
                    
                    const pdfDoc = await pdfjsLib.getDocument({ data: pdfItem.buffer }).promise;

                    for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                        const page = await pdfDoc.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        const rollNumbers = pageText.match(/\b\d{8,12}\b/g) || [];

                        if (rollNumbers.length > 0) {
                            const viewport = page.getViewport({ scale: 1.8 });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;

                            await page.render({ canvasContext: context, viewport: viewport }).promise;
                            const imageData = canvas.toDataURL('image/png');

                            const tx = db.transaction("results", "readwrite");
                            const store = tx.objectStore("results");
                            
                            const uniqueRolls = [...new Set(rollNumbers)];
                            for (const roll of uniqueRolls) {
                                store.put({ roll: roll, imageData: imageData });
                                indexedCount++;
                            }
                        }
                    }

                    const progress = Math.round(((i + 1) / totalFiles) * 100);
                    progressBar.style.width = progress + "%";
                    processPercent.innerText = progress + "%";
                }

                adminAlert.className = "p-3 rounded-xl text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                adminAlert.innerText = `✅ اكتملت العملية! تمت فهرسة (${indexedCount}) رقم امتحاني بنجاح.`;
                adminAlert.classList.remove('hidden');
                updateStatusBadge();

            } catch (err) {
                adminAlert.className = "p-3 rounded-xl text-xs font-bold bg-red-500/10 text-red-400 border border-red-500/20";
                adminAlert.innerText = "حدث خطأ: " + err.message;
                adminAlert.classList.remove('hidden');
            } finally {
                startBtn.disabled = false;
            }
        }

        function clearDatabase() {
            if (confirm("هل أنت تأكد من مسح كافة البيانات المخزنة؟")) {
                const tx = db.transaction("results", "readwrite");
                tx.objectStore("results").clear();
                tx.oncomplete = () => {
                    alert("تم مسح كافة البيانات بنجاح!");
                    updateStatusBadge();
                };
            }
        }
    </script>
</body>
</html>
