<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الفيديوهات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f0f10; color: #fff; padding: 15px; }
        .header { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #0088cc; }
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: #1c1c1e; border-radius: 12px; overflow: hidden; border: 1px solid #2c2c2e; }
        video { width: 100%; max-height: 350px; background: #000; display: block; }
        .title { padding: 12px; font-size: 16px; font-weight: 600; text-align: right; }
        .empty { text-align: center; color: #8e8e93; padding: 40px; }
    </style>
</head>
<body>
    <div class="header">🎬 الفيديوهات المرفوعة</div>
    <div class="container" id="videosList">
        <div class="empty">جاري تحميل الفيديوهات... ⏳</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        async function loadVideos() {
            try {
                // جلب البيانات مباشرة من ملف videos.json بداخل GitHub
                const res = await fetch('./videos.json?t=' + Date.now());
                const videos = await res.json();
                const container = document.getElementById('videosList');

                if (!videos || videos.length === 0) {
                    container.innerHTML = '<div class="empty">لا توجد فيديوهات مرفوعة حالياً 📭</div>';
                    return;
                }

                container.innerHTML = videos.map(v => `
                    <div class="card">
                        <video src="${v.url}" controls playsinline preload="metadata"></video>
                        <div class="title">📌 ${v.title}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('videosList').innerHTML = '<div class="empty">حدث خطأ في تحميل الفيديوهات!</div>';
            }
        }
        loadVideos();
    </script>
</body>
</html>
